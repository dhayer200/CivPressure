    - spruce_sapling
    - birch_sapling
    - jungle_sapling
    - acacia_sapling
    - dark_oak_sapling
    - cherry_sapling
    - pale_oak_sapling
    - poplar_sapling
    - mangrove_propagule
  group-slots:
    plains: 10
    iron: 11
    gold: 12
    lapis: 13
    redstone: 14
    emerald: 15
    diamond: 16
    ungrouped: 22
  group-icons:
    plains: grass_block
    iron: iron_ingot
    gold: gold_ingot
    lapis: lapis_lazuli
    redstone: redstone
    emerald: emerald
    diamond: diamond
    ungrouped: deepslate

nightfall:
  overworld-only: true
  # Nights get more dangerous with the world's age (in days) until this cap.
  cap-nights: 50
  # How often the module checks each player for sounds and pack spawns (ticks).
  tick-interval-ticks: 200
  mob-strength:
    # Also strengthen normal hostiles that spawn at night, not just night packs.
    affect-natural-spawns: true
    # Strip escalation buffs from loaded mobs when the module is turned off.
    restore-when-disabled: true
    # Bonus applied on the very first night (health and damage; speed is excluded).
    # 0.0 means night 1 hostiles are fully vanilla; the buff ramps up from there.
    first-night-bonus: 0.0
    # Bonuses reached at the cap (day cap-nights).
    max-health-bonus: 1.5
    max-damage-bonus: 0.5
    # Speed only applies to zombies (and zombie variants); all other mobs keep
    # vanilla speed. Ramps from 0 on the first night to this bonus at the cap.
    max-speed-bonus: 0.15
    # Make every night zombie able to break wooden/copper doors (vanilla only
    # gives ~10% of zombies this). NOTE: actual breaking still needs the world on
    # Hard difficulty with the mobGriefing gamerule true. Iron doors are immune.
    zombies-break-doors: true
  spawn-rate:
    # Increase the effective night spawn rate: chance to spawn one extra hostile
    # next to each natural night spawn. 0.25 = +25%. Values above 1 add more than
    # one (e.g. 1.5 = one guaranteed extra plus a 50% chance of a second).
    enabled: true
    bonus: 0.25
  spawns:
    enabled: true
    min-distance: 16.0
    max-distance: 40.0
    location-attempts: 12
    nearby-radius: 48.0
    max-nearby-per-player: 24
    # A diversified siege is GUARANTEED near each player once per night (unlike
    # vanilla zombie sieges, which are only a nightly chance). Its size scales
    # from min (night 1) to max (cap). At least one jockey is always included.
    min-pack-size: 6
    max-pack-size: 12
    target-player: true
    # Fraction of the siege that arrives as jockey "cavalry" (rider on a mount).
    jockey-fraction: 0.35
    # Weighted makeup of the non-jockey "infantry". Creeper is deliberately low.
    composition:
      zombie: 5
      husk: 2
      skeleton: 3
      stray: 2
      spider: 2
      drowned: 1
      pillager: 2
      creeper: 1
  jockeys:
    # Jockeys are a rider on a mount. Every mount x rider combination is used,
    # e.g. skeleton/baby-zombie on a spider (spider jockey) or a chicken
    # (chicken jockey).
    mounts:
      - spider
      - chicken
    riders:
      - skeleton
      - baby_zombie
    # Also boost natural night jockeys: when a spider/chicken spawns naturally at
    # night, chance to saddle it with a rider.
    natural-boost-enabled: true
    spider-rider-chance: 0.5
    chicken-rider-chance: 0.3
  giant:
    # Once past first-night, a hunting pack may arrive escorted by a giant.
    # The giant's stats, terrain damage, loot, and despawn come from the
    # giant-events section, so its terrain damage requires giant-events
    # block-damage + terrain-damage-enabled (both on by default).
    enabled: true
    first-night: 15
    chance-per-pack: 0.15
    max-per-world: 1
    announce: false
  sounds:
    enabled: true
    # Category the sounds play under. MASTER ignores per-category volume sliders
    # (Ambient, Music, Hostile Creatures, etc.) so they are heard unless the
    # player has muted their entire game.
    category: master
    volume: 0.9
    pitch-min: 0.6
    pitch-max: 1.0
    distance: 8.0
    min-chance-per-cycle: 0.25
    max-chance-per-cycle: 0.85
    # Ramp sound frequency toward midnight and ease off near dawn.
    night-curve: true
    # Any vanilla sound id works here; add your own to this list.
    list:
      - ambient.cave
      - entity.warden.heartbeat
      - entity.warden.nearby_closer
      - entity.sculk_shrieker.shriek
      - entity.enderman.stare
      - entity.ghast.warn
      - ambient.soul_sand_valley.mood
      - ambient.basalt_deltas.mood
