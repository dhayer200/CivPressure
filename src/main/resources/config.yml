modules:
  ore-redistribution:
    enabled: true
  seasons:
    enabled: false
  fall-damage:
    enabled: true
  slow-regen:
    enabled: true
  durability-pressure:
    enabled: true
  biome-compass:
    enabled: false
  mob-buffs:
    enabled: true
  mountain-polar-bears:
    enabled: true
  nightfall:
    enabled: true
  # Extra trapped skeleton-horse hordes on storm lightning. Chance scales
  # linearly with Nightfall days (0% night 1 → max-chance at the cap).
  skeleton-traps:
    enabled: true

biome-groups:
  display-names:
    plains: Plains and Forests
    iron: Taigas and Savannas
    gold: Deserts and Badlands
    lapis: Swamps and Dark Forests
    redstone: Jungles
    emerald: Windswept Highlands
    diamond: Snowy Peaks and Frozen Lands
    ungrouped: Underground and Unclaimed Wilds

ore-redistribution:
  max-scan-radius: 5
  max-process-radius: 5
  testarea-start-radius: 10000
  testarea-step: 5000
  # Which ore configuration is active. Two switchable profiles:
  #   flat   = every ore is 'flat-profile-rate'% of vanilla EVERYWHERE, with no
  #            biome biasing (an across-the-board debuff). The 'rates:' table is
  #            ignored while this is selected.
  #   biased = the per-region specialization table under 'rates:' (mountains
  #            favor emerald, snowy favors diamond, etc.).
  # To switch back to the biased world: set this to 'biased' and un-comment the
  # 'rates:' block below, then /civ reload.
  profile: flat
  flat-profile-rate: 90
  # Percent of vanilla generation per biome group. 100 = vanilla, 200 = double,
  # 0 = none. ACTIVE ONLY WHEN profile: biased (currently commented out).
  # rates:
  #   plains:
  #     coal: 85
  #     copper: 85
  #     iron: 85
  #     gold: 85
  #     lapis: 85
  #     redstone: 85
  #     emerald: 80
  #     diamond: 80
  #   iron:
  #     coal: 85
  #     copper: 85
  #     iron: 140
  #     gold: 90
  #     lapis: 75
  #     redstone: 75
  #     emerald: 75
  #     diamond: 75
  #   gold:
  #     coal: 85
  #     copper: 85
  #     iron: 90
  #     gold: 140
  #     lapis: 75
  #     redstone: 75
  #     emerald: 75
  #     diamond: 75
  #   lapis:
  #     coal: 85
  #     copper: 85
  #     iron: 75
  #     gold: 75
  #     lapis: 120
  #     redstone: 100
  #     emerald: 75
  #     diamond: 75
  #   redstone:
  #     coal: 85
  #     copper: 85
  #     iron: 75
  #     gold: 75
  #     lapis: 100
  #     redstone: 120
  #     emerald: 75
  #     diamond: 75
  #   emerald:
  #     coal: 85
  #     copper: 85
  #     iron: 65
  #     gold: 65
  #     lapis: 65
  #     redstone: 65
  #     emerald: 200
  #     diamond: 150
  #   diamond:
  #     coal: 85
  #     copper: 85
  #     iron: 65
  #     gold: 65
  #     lapis: 65
  #     redstone: 65
  #     emerald: 150
  #     diamond: 200
  #   ungrouped:
  #     coal: 90
  #     copper: 90
  #     iron: 90
  #     gold: 90
  #     lapis: 90
  #     redstone: 90
  #     emerald: 90
  #     diamond: 90

seasons:
  overworld-only: true
  clock-world: ''
  automatic-rolls-enabled: true
  roll-check-interval-ticks: 100
  max-catch-up-days: 32
  drought-chance: 0.12
  wet-chance: 0.12
  drought-block-chance: 0.75
  drought-block-chance-cold: 0.9
  wet-bonus-chance: 0.4
  wet-bonus-chance-cold: 0.6
  end-chance-start: 0.3
  end-chance-increase-per-day: 0.045
  max-end-chance: 0.99
  broadcast-start-end: true
  crop-effects-enabled: true
  drought-crop-effect-enabled: true
  wet-crop-effect-enabled: true
  farmland-enabled: true
  drought-farmland-enabled: true
  wet-farmland-enabled: true
  farmland-check-radius: 8
  farmland-vertical-radius: 4
  farmland-max-block-checks-per-player: 5000
  farmland-check-interval-ticks: 100
  farmland-drought-moisture: 0
  farmland-wet-moisture: 7
  crop-materials:
    - wheat
    - carrots
    - potatoes
    - beetroots
    - melon_stem
    - pumpkin_stem
    - cocoa
    - sweet_berry_bush
  cold-biomes:
    - snowy_taiga
    - grove
    - jagged_peaks
    - frozen_peaks
    - snowy_slopes
    - snowy_plains
    - ice_spikes
    - frozen_river
    - frozen_ocean
    - deep_frozen_ocean
    - snowy_beach

fall-damage:
  multiplier: 1.2
  players-only: true

slow-regen:
  slow-factor: 1.5
  sleep-regen-enabled: true
  sleep-regen-duration-ticks: 2400
  sleep-regen-amplifier: 0
  sleep-regen-ambient: false
  sleep-regen-particles: true
  sleep-regen-icon: true

durability-pressure:
  affect-creative: false
  affect-spectator: false
  tools-multiplier: 1.025
  weapons-multiplier: 1.05
  armor-multiplier: 1.05
  shields-multiplier: 1.025
  bows-crossbows-multiplier: 1.05
  utility-multiplier: 1.025
  include-mending-items: true
  respect-unbreaking: true
  max-extra-damage-per-event: 3

mob-buffs:
  buff-existing-loaded-entities: true
  restore-loaded-entities-when-disabled: true
  # Nightfall owns ALL hostile strength (health/damage/speed), so keep this at
  # 1.0 to avoid double-buffing hostiles. Passive + golem buffs stay high here.
  hostile-health-multiplier: 1.0
  passive-health-multiplier: 1.5
  golem-health-multiplier: 1.0
  golem-knockback-resistance: 1.0
  heal-newly-buffed-spawns: true
  # Off so mob-buffs stays purely passive/golem; Nightfall handles all hostiles.
  cold-skeletons-as-strays: false
  stray-spawn-reasons:
    - natural
    - chunk_gen
    - spawner
    - trial_spawner
    - reinforcements
    - patrol
  cold-biomes:
    - snowy_taiga
    - grove
    - frozen_peaks
    - snowy_slopes
    - snowy_plains
    - ice_spikes
    - frozen_river
    - frozen_ocean
    - deep_frozen_ocean
    - snowy_beach

giant-events:
  target-players: true
  target-non-hostile-mobs: true
  overworld-only: true
  remove-existing-when-disabled: false
  spawn-check-interval-ticks: 24000
  spawn-chance-per-check: 0.25
  max-giants-per-world: 3
  min-distance-from-spawn: 1000
  min-distance-from-players: 80
  max-distance-from-players: 180
  location-attempts: 32
  require-night: true
  maintenance-interval-ticks: 20
  despawn-after-ticks: 36000
  keep-alive-while-players-nearby: true
  engagement-radius: 256.0
  follow-range: 256.0
  pathfinder-speed: 1.0
  attack-range: 7.0
  attack-cooldown-ticks: 30
  health: 200.0
  damage: 12.0
  movement-speed: 0.3
  knockback-resistance: 0.75
  announce-spawn: true
  announce-exact-coordinates: true
  announcement-message: A giant has been sighted in the {direction} wilderness...
  block-damage: true
  terrain-damage-enabled: true
  # TNT-sized craters while walking. Only unbreakable/world-anchor blocks are
  # skipped — chests and player builds are not spared.
  terrain-damage-chance: 1.0
  terrain-damage-radius: 4
  terrain-damage-blocks-per-tick: 200
  terrain-damage-require-target: false
  terrain-damage-protected-materials:
    - bedrock
    - barrier
    - command_block
    - repeating_command_block
    - chain_command_block
    - structure_block
    - jigsaw
    - end_portal
    - end_portal_frame
  allowed-biome-groups:
    - plains
    - iron
    - gold
    - emerald
    - diamond
    - ungrouped
  loot:
    clear-vanilla-drops: true
    experience: 40
    iron:
      enabled: true
      material: iron_ingot
      minimum: 8
      maximum: 15
      chance: 1.0
    gold:
      enabled: true
      material: gold_ingot
      minimum: 5
      maximum: 10
      chance: 0.6
    emerald:
      enabled: true
      material: emerald
      minimum: 3
      maximum: 6
      chance: 0.6
    diamond:
      enabled: true
      material: diamond
      minimum: 1
      maximum: 5
      chance: 0.5
    trophy:
      enabled: true
      material: ghast_tear
      name: Giant Trophy
      chance: 1.0

mountain-polar-bears:
  overworld-only: true
  # Ground level so bears roam snowy plains/ice spikes, not just high peaks.
  min-y: 60
  spawn-chance: 0.65
  nearby-radius: 64.0
  max-nearby: 8
  spawn-reasons:
    - natural
    - chunk_gen
  # Every mountainous & snowy biome.
  biomes:
    - grove
    - jagged_peaks
    - stony_peaks
    - windswept_hills
    - windswept_gravelly_hills
    - windswept_forest
    - frozen_peaks
    - snowy_slopes
    - snowy_plains
    - ice_spikes
    - snowy_taiga
    - snowy_beach

biome-compass:
  recipe-enabled: true
  item-name: Biome Compass
  item-lore:
    - Right-click to choose a region.
    - 'Selected region: {group}'
  search-radius: 6000
  update-interval-ticks: 40
  movement-research-distance: 256
  cache-duration-seconds: 300
  async-search: false
  max-concurrent-searches: 2
  search-horizontal-interval: 32
  search-vertical-interval: 64
  gui-title: Select Biome Group
  gui-size: 27
  gui-fill-empty: true
  gui-filler-material: gray_stained_glass_pane
  recipe-saplings:
    - oak_sapling
    - spruce_sapling
    - birch_sapling
    - jungle_sapling
    - acacia_sapling
    - dark_oak_sapling
    - cherry_sapling
    - pale_oak_sapling
    - poplar_sapling
    - mangrove_propagule
  group-slots:
    plains: 10
    iron: 11
    gold: 12
    lapis: 13
    redstone: 14
    emerald: 15
    diamond: 16
    ungrouped: 22
  group-icons:
    plains: grass_block
    iron: iron_ingot
    gold: gold_ingot
    lapis: lapis_lazuli
    redstone: redstone
    emerald: emerald
    diamond: diamond
    ungrouped: deepslate

nightfall:
  overworld-only: true
  # Linear escalation clock. Night 1 is vanilla; everything ramps to this day.
  cap-nights: 200
  tick-interval-ticks: 200
  sleep:
    # Vanilla monster-near-bed check is 8x5x8. 1.2 = slightly harder to sleep.
    monster-radius-multiplier: 1.2
  mob-strength:
    affect-natural-spawns: true
    restore-when-disabled: true
    first-night-bonus: 0.0
    # Added on top of vanilla: 0.5 = +50% health (x1.5) at the cap.
    max-health-bonus: 0.5
    max-damage-bonus: 0.25
    max-speed-bonus: 0.15
    zombies-break-doors: true
  spawn-rate:
    # Extra natural hostiles. 0% on night 1, this value at the cap (0.5 = +50%).
    enabled: true
    bonus: 0.5
  spawns:
    enabled: true
    min-distance: 16.0
    max-distance: 40.0
    location-attempts: 12
    nearby-radius: 48.0
    max-nearby-per-player: 24
    village-radius: 96
    # Beds and villages. Chance-based (not guaranteed, not around lone players).
    siege-chance-min: 0.05
    siege-chance-max: 0.50
    # Linear pack size: 12 on night 1, 24 (2x) at the cap.
    min-pack-size: 12
    max-pack-size: 24
    min-jockeys: 1
    max-jockeys: 2
    target-player: true
    composition:
      zombie: 8
      zombie_villager: 3
      skeleton: 4
      stray: 2
      husk: 2
  jockeys:
    mounts:
      - spider
    # Weighted. Skeletons are the main riders; baby_zombie is 1.25x a base slot.
    riders:
      skeleton: 16
      stray: 4
      husk: 2
      baby_zombie: 5
    natural-boost-enabled: true
    spider-rider-chance-min: 0.01
    spider-rider-chance: 0.35
  skeleton-traps:
    min-chance: 0.0
    max-chance: 0.25
  giant:
    # Siege-only. Unlocked with phantoms; chance ramps 5% → 30% from first-night to cap.
    enabled: true
    first-night: 100
    unlock-chance: 0.05
    chance-per-pack: 0.3
    max-per-world: 1
    announce: false
  phantoms:
    enabled: true
    first-night: 100
    unlock-chance: 0.15
    max-chance-per-night: 0.6
    count: 2
  sounds:
    enabled: true
    # Category the sounds play under. MASTER ignores per-category volume sliders
    # (Ambient, Music, Hostile Creatures, etc.) so they are heard unless the
    # player has muted their entire game.
    category: master
    volume: 0.9
    pitch-min: 0.6
    pitch-max: 1.0
    distance: 8.0
    min-chance-per-cycle: 0.25
    max-chance-per-cycle: 0.85
    # Ramp sound frequency toward midnight and ease off near dawn.
    night-curve: true
    # Any vanilla sound id works here; add your own to this list.
    list:
      - ambient.cave
      - entity.warden.heartbeat
      - entity.warden.nearby_closer
      - entity.sculk_shrieker.shriek
      - entity.enderman.stare
