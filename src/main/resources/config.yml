  search-radius: 6000
  update-interval-ticks: 40
  movement-research-distance: 256
  cache-duration-seconds: 300
  async-search: false
  max-concurrent-searches: 2
  search-horizontal-interval: 32
  search-vertical-interval: 64
  gui-title: Select Biome Group
  gui-size: 27
  gui-fill-empty: true
  gui-filler-material: gray_stained_glass_pane
  recipe-saplings:
