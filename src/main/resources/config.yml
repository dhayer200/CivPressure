    enabled: true
  seasons:
    enabled: true
  fall-damage:
    enabled: true
  slow-regen:
    enabled: true
  durability-pressure:
    enabled: true
  biome-compass:
    enabled: true
  mob-buffs:
    enabled: true
  giant-events:
    enabled: true
  mountain-polar-bears:
    enabled: true
  nightfall:
    enabled: true

biome-groups:
  display-names:
    plains: Plains and Forests
    iron: Taigas and Savannas
    gold: Deserts and Badlands
    lapis: Swamps and Dark Forests
    redstone: Jungles
    emerald: Windswept Highlands
    diamond: Snowy Peaks and Frozen Lands
    ungrouped: Underground and Unclaimed Wilds

ore-redistribution:
  max-scan-radius: 5
  max-process-radius: 5
  testarea-start-radius: 10000
  testarea-step: 5000
  # Which ore configuration is active. Two switchable profiles:
  #   flat   = every ore is 'flat-profile-rate'% of vanilla EVERYWHERE, with no
  #            biome biasing (an across-the-board debuff). The 'rates:' table is
  #            ignored while this is selected.
  #   biased = the per-region specialization table under 'rates:' (mountains
  #            favor emerald, snowy favors diamond, etc.).
  # To switch back to the biased world: set this to 'biased' and un-comment the
  # 'rates:' block below, then /civ reload.
  profile: flat
  flat-profile-rate: 90
  # Percent of vanilla generation per biome group. 100 = vanilla, 200 = double,
  # 0 = none. ACTIVE ONLY WHEN profile: biased (currently commented out).
