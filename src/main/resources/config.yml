modules:
  ore-redistribution:
    enabled: true
  seasons:
    enabled: true
  animal-flee:
    enabled: false
  fall-damage:
    enabled: true
  slow-regen:
    enabled: true
  durability-pressure:
    enabled: true
  freeze:
    enabled: false
  wind:
    enabled: false
  drowning:
    enabled: false
  biome-compass:
    enabled: false
  mob-buffs:
    enabled: true
  giant-events:
    enabled: true
  mountain-polar-bears:
    enabled: true

biome-groups:
  display-names:
    plains: Plains and Forests
    iron: Taigas and Savannas
    gold: Deserts and Badlands
    lapis: Swamps and Dark Forests
    redstone: Jungles
    emerald: Windswept Highlands
    diamond: Snowy Peaks and Frozen Lands
    ungrouped: Underground and Unclaimed Wilds

ore-redistribution:
  max-scan-radius: 5
  max-process-radius: 5
  testarea-start-radius: 10000
  testarea-step: 5000
  rates:
    plains:
      iron: 85
      gold: 85
      lapis: 50
      redstone: 40
      emerald: 20
      diamond: 20
    iron:
      iron: 140
      gold: 70
      lapis: 50
      redstone: 40
      emerald: 20
      diamond: 20
    gold:
      iron: 80
      gold: 140
      lapis: 50
      redstone: 40
      emerald: 20
      diamond: 20
    lapis:
      iron: 80
      gold: 70
      lapis: 120
      redstone: 40
      emerald: 20
      diamond: 20
    redstone:
      iron: 80
      gold: 70
      lapis: 50
      redstone: 120
      emerald: 20
      diamond: 20
    emerald:
      iron: 70
      gold: 60
      lapis: 50
      redstone: 40
      emerald: 200
      diamond: 80
    diamond:
      iron: 70
      gold: 60
      lapis: 50
