seasons:
  overworld-only: true
  clock-world: ''
  automatic-rolls-enabled: true
  roll-check-interval-ticks: 100
  max-catch-up-days: 32
  drought-chance: 0.12
  wet-chance: 0.12
  drought-block-chance: 0.75
  drought-block-chance-cold: 0.9
  wet-bonus-chance: 0.4
  wet-bonus-chance-cold: 0.6
  end-chance-start: 0.3
  end-chance-increase-per-day: 0.045
  max-end-chance: 0.99
  broadcast-start-end: true
  crop-effects-enabled: true
  drought-crop-effect-enabled: true
  wet-crop-effect-enabled: true
  farmland-enabled: true
  drought-farmland-enabled: true
  wet-farmland-enabled: true
  farmland-check-radius: 8
  farmland-vertical-radius: 4
  farmland-max-block-checks-per-player: 5000
  farmland-check-interval-ticks: 100
  farmland-drought-moisture: 0
  farmland-wet-moisture: 7
  crop-materials:
    - wheat
    - carrots
    - potatoes
    - beetroots
    - melon_stem
    - pumpkin_stem
    - cocoa
    - sweet_berry_bush
  cold-biomes:
    - snowy_taiga
    - grove
    - jagged_peaks
    - frozen_peaks
    - snowy_slopes
    - snowy_plains
    - ice_spikes
    - frozen_river
    - frozen_ocean
    - deep_frozen_ocean
    - snowy_beach

fall-damage:
  multiplier: 1.2
  players-only: true

slow-regen:
  slow-factor: 1.5
  sleep-regen-enabled: true
  sleep-regen-duration-ticks: 2400
  sleep-regen-amplifier: 0
  sleep-regen-ambient: false
  sleep-regen-particles: true
  sleep-regen-icon: true

durability-pressure:
  affect-creative: false
  affect-spectator: false
  tools-multiplier: 1.025
  weapons-multiplier: 1.05
  armor-multiplier: 1.05
  shields-multiplier: 1.025
  bows-crossbows-multiplier: 1.05
  utility-multiplier: 1.025
  include-mending-items: true
  respect-unbreaking: true
  max-extra-damage-per-event: 3

mob-buffs:
  buff-existing-loaded-entities: true
  restore-loaded-entities-when-disabled: true
  # Nightfall owns ALL hostile strength (health/damage/speed), so keep this at
  # 1.0 to avoid double-buffing hostiles. Passive + golem buffs stay high here.
  hostile-health-multiplier: 1.0
  passive-health-multiplier: 1.75
  golem-health-multiplier: 2.0
  golem-knockback-resistance: 1.0
  heal-newly-buffed-spawns: true
  # Off so mob-buffs stays purely passive/golem; Nightfall handles all hostiles.
  cold-skeletons-as-strays: false
  stray-spawn-reasons:
    - natural
    - chunk_gen
    - spawner
    - trial_spawner
    - reinforcements
    - patrol
  cold-biomes:
    - snowy_taiga
    - grove
    - frozen_peaks
    - snowy_slopes
    - snowy_plains
    - ice_spikes
    - frozen_river
    - frozen_ocean
    - deep_frozen_ocean
    - snowy_beach

giant-events:
  target-players: true
  target-non-hostile-mobs: true
  overworld-only: true
  remove-existing-when-disabled: false
  spawn-check-interval-ticks: 24000
  spawn-chance-per-check: 0.25
  max-giants-per-world: 3
  min-distance-from-spawn: 1000
  min-distance-from-players: 80
  max-distance-from-players: 180
  location-attempts: 32
  require-night: true
  maintenance-interval-ticks: 20
  despawn-after-ticks: 36000
  keep-alive-while-players-nearby: true
  engagement-radius: 256.0
  follow-range: 256.0
  pathfinder-speed: 1.0
  attack-range: 7.0
  attack-cooldown-ticks: 30
  health: 200.0
  damage: 12.0
  movement-speed: 0.3
  knockback-resistance: 0.75
  announce-spawn: true
  announce-exact-coordinates: true
  announcement-message: A giant has been sighted in the {direction} wilderness...
  block-damage: true
  terrain-damage-enabled: true
  # Explosive: every maintenance tick it blasts a TNT-sized crater wherever it
  # walks. Containers and the protected-materials list below are always spared.
  terrain-damage-chance: 1.0
  terrain-damage-radius: 4
  terrain-damage-blocks-per-tick: 200
  terrain-damage-require-target: false
  terrain-damage-protected-materials:
    - bedrock
    - barrier
    - command_block
    - repeating_command_block
    - chain_command_block
    - structure_block
    - jigsaw
    - end_portal
    - end_portal_frame
    - reinforced_deepslate
    - chest
    - trapped_chest
    - barrel
    - shulker_box
    - white_shulker_box
    - orange_shulker_box
    - magenta_shulker_box
    - light_blue_shulker_box
    - yellow_shulker_box
    - lime_shulker_box
    - pink_shulker_box
    - gray_shulker_box
    - light_gray_shulker_box
    - cyan_shulker_box
    - purple_shulker_box
    - blue_shulker_box
    - brown_shulker_box
    - green_shulker_box
    - red_shulker_box
    - black_shulker_box
  allowed-biome-groups:
    - plains
    - iron
    - gold
    - emerald
    - diamond
    - ungrouped
  loot:
    clear-vanilla-drops: true
    experience: 40
    iron:
      enabled: true
      material: iron_ingot
      minimum: 8
      maximum: 15
      chance: 1.0
    gold:
      enabled: true
      material: gold_ingot
      minimum: 5
      maximum: 10
      chance: 0.6
    emerald:
      enabled: true
      material: emerald
      minimum: 3
      maximum: 6
      chance: 0.6
    diamond:
      enabled: true
      material: diamond
      minimum: 1
      maximum: 5
      chance: 0.5
    trophy:
      enabled: true
      material: ghast_tear
      name: Giant Trophy
      chance: 1.0

mountain-polar-bears:
  overworld-only: true
  # Ground level so bears roam snowy plains/ice spikes, not just high peaks.
  min-y: 60
  spawn-chance: 0.65
  nearby-radius: 64.0
  max-nearby: 8
  spawn-reasons:
    - natural
    - chunk_gen
  # Every mountainous & snowy biome.
  biomes:
    - grove
    - jagged_peaks
    - stony_peaks
    - windswept_hills
    - windswept_gravelly_hills
    - windswept_forest
    - frozen_peaks
    - snowy_slopes
    - snowy_plains
    - ice_spikes
    - snowy_taiga
    - snowy_beach

biome-compass:
  recipe-enabled: true
  item-name: Biome Compass
  item-lore:
